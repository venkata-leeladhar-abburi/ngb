# Quality gates from docs/strategy/build-playbook.md section 8.
# Protect `main` in GitHub settings and mark every job below as a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_CACHE_DIR: .turbo/cache
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  stories:
    name: Storybook stories + axe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @ngb/ui exec playwright install --with-deps chromium
      - run: pnpm test:stories

  e2e:
    name: End-to-end (360 px Android + 1440 px desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @ngb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  visual:
    name: Visual snapshots (every Storybook story)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm --filter @ngb/e2e exec playwright install --with-deps chromium
      # "missing" writes references only where none exist yet (first Linux run); any existing reference
      # that no longer matches fails the job. A person reviews and commits new references.
      - run: pnpm turbo run visual --filter=@ngb/e2e -- --update-snapshots=missing
      - name: Upload Linux references for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-references-linux
          path: e2e/visual/__screenshots__/linux
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: e2e/visual-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile budgets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          retention-days: 7

  security:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Audit dependencies (fail on high or critical)
        run: pnpm audit --audit-level high --prod
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
