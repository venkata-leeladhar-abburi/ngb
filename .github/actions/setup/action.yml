name: Setup
description: Install pnpm, Node (from .nvmrc) and dependencies, and restore the Turborepo cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Restore Turborepo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
